name: DSH compatibility

# Every day, build and test Citer against the newest DSH releases. engines.dsh has no upper bound,
# so DSH never refuses a newer host and every probed release is one users can already run Citer on:
# a failure there means a DSH change broke Citer and needs a fix release.
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    name: DSH ${{ matrix.tag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: [latest, next, alpha]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Resolve the DSH version
        id: dsh
        run: echo "version=$(npm view @deepseek-ai/dsh@${{ matrix.tag }} version)" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - name: Use DSH ${{ steps.dsh.outputs.version }} as the main SDK
        id: sdk
        run: node packages/citeciter/scripts/use-sdk.mjs "${{ steps.dsh.outputs.version }}"
      # pnpm verifies the lockfile before running any script, so the changed SDK is installed
      # first and the Git entry is synchronized with node directly.
      - name: Install the probe SDK
        id: install
        # Outside engines.dsh a failure is an early warning, not a broken release.
        continue-on-error: ${{ steps.sdk.outputs.declared != 'true' }}
        run: |
          node packages/citeciter/scripts/sync-git-entry.mjs
          pnpm install --no-frozen-lockfile
      - name: Checks
        id: checks
        if: steps.install.outcome == 'success'
        continue-on-error: ${{ steps.sdk.outputs.declared != 'true' }}
        run: |
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Summary
        if: always()
        run: echo "DSH ${{ steps.dsh.outputs.version }} (${{ matrix.tag }}), inside engines.dsh = ${{ steps.sdk.outputs.declared }}, install = ${{ steps.install.outcome }}, checks = ${{ steps.checks.outcome }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Report a broken supported release
        if: failure() && steps.sdk.outputs.declared == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.dsh.outputs.version }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="DSH $VERSION is inside engines.dsh but Citer does not build against it"
          if [ -z "$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[].number')" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "The scheduled compatibility check failed: $RUN. Users on DSH $VERSION can load this Citer release. Adapt Citer to it and release."
          fi
