name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  compatibility:
    name: ${{ matrix.os }} / Node ${{ matrix.node }} / DSH 0.1.5-rc.1
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22.19.0
            os: ubuntu-latest
          - node: '24'
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install -g @deepseek-ai/dsh@0.1.5-rc.1
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:snapshot
      - run: pnpm --dir packages/citeciter pack --pack-destination "${{ github.workspace }}/.refs/artifacts"
      - run: node packages/citeciter/dev/run-smoke.mjs .refs/artifacts/kirkchinese-dsh-citeciter-0.7.0-beta.2.tgz
