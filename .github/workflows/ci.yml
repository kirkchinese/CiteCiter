name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  compatibility:
    name: Node ${{ matrix.node }} / DSH ${{ matrix.dsh }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22.19.0
            dsh: 0.1.1-rc.2
          - node: '24'
            dsh: 0.1.1-rc.1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Select DSH compatibility target
        env:
          DSH_VERSION: ${{ matrix.dsh }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'

          const path = 'packages/citeciter/package.json'
          const manifest = JSON.parse(await readFile(path, 'utf8'))
          for (const name of Object.keys(manifest.devDependencies)) {
            if (name.startsWith('@deepseek-ai/dsh-')) {
              manifest.devDependencies[name] = process.env.DSH_VERSION
            }
          }
          await writeFile(path, `${JSON.stringify(manifest, null, 2)}\n`)

          const workspacePath = 'pnpm-workspace.yaml'
          const workspace = await readFile(workspacePath, 'utf8')
          await writeFile(workspacePath, workspace.replaceAll('0.1.1-rc.2', process.env.DSH_VERSION))
          NODE
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm --filter @kirkchinese/dsh-citeciter pack --pack-destination "$RUNNER_TEMP"
