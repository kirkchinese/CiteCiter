name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  static-checks:
    name: ${{ matrix.os }} / Node ${{ matrix.node }} / DSH 0.2.1-alpha.2 + official Desktop 0.2.0-rc.2
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22.19.0
            os: ubuntu-latest
          - node: '24'
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm check:git-entry
      - run: pnpm check:readme
      - run: pnpm install --frozen-lockfile
      - run: pnpm peers check
      - run: pnpm typecheck
      - run: pnpm typecheck:desktop
      - run: pnpm test
      - run: pnpm build
      - name: Committed lib/ matches the build
        run: git diff --exit-code --stat -- packages/citeciter/lib
      - run: pnpm --dir packages/citeciter pack --pack-destination "${{ github.workspace }}/.refs/artifacts"
      - run: git diff --check
