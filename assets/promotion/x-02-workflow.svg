<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">CiteCiter — start with one real question</title>
  <desc id="desc">Workflow concept, not a product screenshot. Quote a real passage from a conversation, tool result or document. Ask a question in a separate Topic with the reference in context. Return to work with a question explored. Sending is manual and the source conversation stays separate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8faf7"/><stop offset="1" stop-color="#e4efeb"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="64" y="48" width="28" height="28" rx="8" fill="#20745f"/>
    <path d="M73 59h6m-6 6h10" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    <text x="106" y="70" fill="#18362f" font-size="25" font-weight="700">CiteCiter</text>
    <text x="1136" y="68" text-anchor="end" fill="#59776c" font-size="17" letter-spacing="1.2">WORKFLOW CONCEPT / NOT A SCREENSHOT</text>
    <text x="64" y="159" fill="#172e29" font-size="52" font-weight="650" letter-spacing="-1.3">Start with one real question.</text>
    <text x="64" y="207" fill="#526d62" font-size="26">Keep it connected to the work that raised it.</text>
    <rect x="64" y="265" width="328" height="258" rx="26" fill="#fff" stroke="#d4e0d9"/>
    <rect x="436" y="265" width="328" height="258" rx="26" fill="#20745f"/>
    <rect x="808" y="265" width="328" height="258" rx="26" fill="#fff" stroke="#d4e0d9"/>
    <path d="M402 392h23m-7-7 7 7-7 7m356-7h23m-7-7 7 7-7 7" fill="none" stroke="#91ac9f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="88" y="311" fill="#247660" font-size="18" font-weight="600" letter-spacing="1.8">01 / QUOTE</text>
    <text x="88" y="372" fill="#244238" font-size="28" font-weight="650">A real passage</text>
    <text x="88" y="429" fill="#526d62" font-size="23">Conversation, tool result</text>
    <text x="88" y="464" fill="#526d62" font-size="23">or document.</text>
    <text x="460" y="311" fill="#c5e5d9" font-size="18" font-weight="600" letter-spacing="1.8">02 / ASK</text>
    <text x="460" y="372" fill="#fff" font-size="28" font-weight="650">A separate Topic</text>
    <text x="460" y="429" fill="#e0f0e9" font-size="23">Ask with the reference</text>
    <text x="460" y="464" fill="#e0f0e9" font-size="23">kept in context.</text>
    <text x="832" y="311" fill="#247660" font-size="18" font-weight="600" letter-spacing="1.8">03 / EXPLORE</text>
    <text x="832" y="372" fill="#244238" font-size="28" font-weight="650">Your next question</text>
    <text x="832" y="429" fill="#526d62" font-size="23">Why this decision?</text>
    <text x="832" y="464" fill="#526d62" font-size="23">What if things change?</text>
    <text x="64" y="588" fill="#244238" font-size="25" font-weight="500">You choose when to send. The source conversation stays separate.</text>
    <text x="64" y="631" fill="#59776c" font-size="21">Open-source plugin for DeepSeek Harness (DSH)</text>
    <text x="1136" y="631" fill="#59776c" font-size="21" text-anchor="end">kirkchinese/CiteCiter</text>
  </g>
</svg>
