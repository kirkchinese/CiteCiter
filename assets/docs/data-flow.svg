<text x="453" y="126">独立 Topic 日志 · Private Topic</text><text x="453" y="155" class="small">问题、回复和完整工具记录</text><text x="453" y="177" class="small">Questions, answers, committed tool records</text>
<path d="M740 146 H810 V80 H871 M810 146 V201 H871" fill="none" stroke="#367a6c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="895" y="72">板书 · Board</text><text x="895" y="101" class="small">从日志重放 · Restore from the log</text>
<text x="895" y="191">最新完整卡片组 · Latest card set</text><text x="895" y="221" class="small">手动导出 Markdown · Manual export</text>
