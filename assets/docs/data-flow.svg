<rect width="1200" height="300" rx="18" fill="#f0f5f3"/>
<g fill="#fff" stroke="#ceded8"><rect x="24" y="54" width="294" height="78" rx="12"/><rect x="24" y="155" width="294" height="78" rx="12"/><rect x="430" y="90" width="310" height="112" rx="12"/><rect x="874" y="36" width="302" height="88" rx="12"/><rect x="874" y="157" width="302" height="88" rx="12"/></g>
<text x="44" y="86">来源 Session · Source log</text><text x="44" y="111" class="small">只读引用 · Read-only evidence</text>
<text x="44" y="187">文档库 · Document library</text><text x="44" y="212" class="small">全文保存、分页阅读 · Full text, paged view</text>
