packages:
  - packages/*
allowBuilds:
  koffi: true
# CiteCiter tracks DSH prereleases on their release day, before the default
# minimum release age has passed. Only packages published from deepseek-ai are exempt.
minimumReleaseAgeExclude:
  - '@deepseek-ai/*'
  - 'node-addon-native-custom-loader'
  - 'node-addon-require-builtin*'
# DSH 0.2.1 (alpha.3 through rc.2) pins zod 4.4.3 in its Typert registry, so both SDK baselines type
# Citer's schemas with that zod. At runtime zod is a peer that the host provides.
overrides:
  zod: 4.4.3
  # The Desktop baseline's settings accept loader ~1.0.5, which now also matches 1.0.6
  # (cordis ~4.0.5). Keep that baseline on the loader for its own cordis 4.0.4.
  '@deepseek-ai/dsh-settings@0.2.0-rc.2>@deepseek-ai/cordis-plugin-loader': 1.0.5
